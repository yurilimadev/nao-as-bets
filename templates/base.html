<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <title>Muralize - Conte sua história</title>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/botoes.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-N5VPST48');
    </script>
    <!-- End Google Tag Manager -->
    <style>
        *{
            font-family: "Roboto Condensed", serif; 
        }
    </style>

    {% block head %}
    {% endblock %}
</head>
<body class="relative bg-[url('https://images.pexels.com/photos/207142/pexels-photo-207142.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1')] bg-cover bg-center bg-no-repeat min-h-screen">
    <div class="absolute inset-0 bg-black opacity-50 -z-10"></div>
    {% with mensagens = get_flashed_messages(with_categories=True)%}
        {% if mensagens %}
        <div id="flash" class="alert-container">
            {% for categoria, mensagem in mensagens %}
                <div class="alert-{{ categoria }} rounded-md p-6
                {% if categoria == 'success' %}
                    bg-green-100 border-green-400 text-green-700
                {% elif categoria == 'fail' %}
                    bg-red-100 border-red-400 text-red-700
                {% endif %} 
                ">{{ mensagem }}</div>
            {% endfor %}
        </div>
            
        {% endif %}
    {% endwith %}
    <script>
        // Remove mensagens após 5 segundos
        setTimeout(() => {
            const flashMessages = document.getElementById('flash');
            if (flashMessages) {
                flashMessages.style.transition = 'opacity 0.5s';
                flashMessages.style.opacity = '0';
                setTimeout(() => flashMessages.remove(), 500); // Remover do DOM após fade
            }
        }, 5000); // Tempo em milissegundos
    </script>

    <!--Cabecalho-->
    <header class="bg-[#000] py-5 drop-shadow-md text-white">
        <nav class="flex justify-between items-center w-[92%] mx-auto">
            <div>
                <h1 class="text-lg font-bold"><a href="{{ url_for('index') }}">Muralize</a></h1>
            </div>
            <div class="md:block hidden nav-links md:static absolute md:min-h-fit min-h-[20vh] left-0 top-[8%] md:w-auto w-full flex items-center px-5 transition-all duration-300 ease-in-out bg-[#000]">
                <ul class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-6">
                    <li><a class="hover:text-gray-500" href="{{ url_for('index') }}">Home</a></li>
                    <li><a class="hover:text-gray-500" href="{{ url_for('motivacao') }}">Motivação</a></li>
                </ul>
            </div>
            <div class="flex items-center gap-6">
                <button class="bg-[#B54343] text-white px-5 py-2 rounded-full hover:bg-[#B543ff]">
                    <a href="{{ url_for('contribua') }}">Contribua</a></button>
                <ion-icon onclick="onToggleMenu(this)" name="menu" class="text-3x1 cursor-pointer md:hidden"></ion-icon>
            </div>
            
        </nav>
    </header>

    {% block body %}
    {% endblock %}

</body>
<!-- Google Tag Manager (noscript) -->

    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N5VPST48"
    height="0" width="0" style="display:none;visibility:hidden">
    </iframe>
</noscript>
    <!-- End Google Tag Manager (noscript) -->
</html>
